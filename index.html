<style>
:root {
  --bg: #0a0a0a;
  --bg-elevated: #111;
  --card-bg: #161616;
  --card-hover: #1c1c1c;
  --card-active: #1a1a1a;
  --text: #f0f0f0;
  --text-secondary: #999;
  --text-muted: #666;
  --accent: #ff3333;
  --accent-soft: rgba(255,51,51,0.12);
  --accent-glow: rgba(255,51,51,0.3);
  --border: rgba(255,255,255,0.07);
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
  --header-h: auto;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  scrollbar-width: thin;
  scrollbar-color: #333 transparent;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #444; }

.accent-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--accent), #ff6644, var(--accent));
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1001;
}

header {
  position: sticky;
  top: 3px;
  z-index: 100;
  background: rgba(10,10,10,0.85);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border-bottom: 1px solid var(--border);
  padding: 16px 16px 0;
  padding-top: max(16px, env(safe-area-inset-top));
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

h1 {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  white-space: nowrap;
  flex-shrink: 0;
}

h1 .dot { color: var(--accent); }

.search-wrapper {
  flex: 1;
  position: relative;
  max-width: 480px;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  color: var(--text-muted);
  pointer-events: none;
}

#search {
  width: 100%;
  padding: 10px 40px 10px 38px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  font-size: 0.9rem;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}

#search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

#search::placeholder { color: var(--text-muted); }

.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 1.1rem;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  transition: background var(--transition);
}

.search-clear.visible { display: flex; }
.search-clear:hover { background: rgba(255,255,255,0.1); }

.shuffle-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all var(--transition);
}

.shuffle-btn:hover { border-color: var(--accent); color: var(--accent); }
.shuffle-btn:active { transform: scale(0.92); }

.filter-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  margin: 0 -16px;
  padding: 0 16px 12px;
}

.filter-scroll::-webkit-scrollbar { display: none; }

.filter-chips {
  display: flex;
  gap: 8px;
  width: max-content;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.chip:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
.chip:active { transform: scale(0.96); }

.chip.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  font-weight: 600;
}

.chip .count {
  font-size: 0.72rem;
  opacity: 0.6;
  font-weight: 400;
}

.chip.active .count { opacity: 0.85; }

#videoCount {
  padding: 0 0 8px;
  font-size: 0.78rem;
  color: var(--text-muted);
  text-align: right;
}

main {
  min-height: calc(100vh - 200px);
  padding-bottom: 80px;
}

.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
  padding: 16px;
}

.video-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
  opacity: 0;
  transform: translateY(20px);
  contain: layout style;
}

.video-card.visible {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.4s ease, transform 0.4s ease, box-shadow var(--transition), background var(--transition);
}

.video-card.playing {
  box-shadow: 0 0 0 2px var(--accent), var(--shadow-lg);
}

.thumbnail-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #111;
  cursor: pointer;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

.thumbnail-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s ease, opacity 0.4s ease;
  background: linear-gradient(110deg, #161616 8%, #1e1e1e 18%, #161616 33%);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
}

.thumbnail-container img.loaded { animation: none; background: #111; }

@keyframes shimmer {
  to { background-position: -200% 0; }
}

.play-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 42px;
  background: rgba(255,0,0,0.85);
  border-radius: 10px / 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), transform var(--transition);
  pointer-events: none;
}

.play-btn::after {
  content: '';
  display: block;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 9px 0 9px 16px;
  border-color: transparent transparent transparent white;
  margin-left: 3px;
}

.duration-badge {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: rgba(0,0,0,0.8);
  color: white;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
  pointer-events: none;
}

.video-info {
  padding: 12px 14px;
}

.video-info .creator {
  display: block;
  font-size: 0.75rem;
  color: var(--text-secondary);
  font-weight: 500;
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.video-info h3 {
  font-size: 0.88rem;
  font-weight: 600;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.video-info .tag-badge {
  display: inline-block;
  margin-top: 8px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.player-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
}

.player-container iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.close-player {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: rgba(0,0,0,0.7);
  color: white;
  font-size: 1.3rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: background var(--transition), transform var(--transition);
  backdrop-filter: blur(4px);
}

.close-player:hover { background: rgba(255,51,51,0.8); }
.close-player:active { transform: scale(0.9); }

.hidden { display: none !important; }

.no-results {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.no-results svg {
  width: 64px;
  height: 64px;
  margin-bottom: 16px;
  opacity: 0.3;
}

.no-results p {
  font-size: 1.1rem;
  margin-bottom: 8px;
}

.no-results .sub { font-size: 0.85rem; }

.back-to-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  bottom: max(24px, env(safe-area-inset-bottom, 24px));
  right: max(24px, env(safe-area-inset-right, 24px));
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  visibility: hidden;
  transform: translateY(16px);
  transition: all 0.3s ease;
  z-index: 99;
  box-shadow: 0 4px 20px var(--accent-glow);
  -webkit-tap-highlight-color: transparent;
}

.back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
.back-to-top:hover { transform: translateY(-2px); box-shadow: 0 6px 28px var(--accent-glow); }
.back-to-top:active { transform: scale(0.92); }

@media (min-width: 480px) {
  .video-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (min-width: 640px) {
  header { padding: 20px 24px 0; }
  .filter-scroll { margin: 0 -24px; padding: 0 24px 12px; }
  h1 { font-size: 1.4rem; }
  .video-grid { gap: 20px; padding: 20px; }
  .video-info { padding: 14px 16px; }
  .video-info h3 { font-size: 0.92rem; }
}

@media (min-width: 768px) {
  .video-grid {
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    padding: 24px;
  }
}

@media (min-width: 1024px) {
  .video-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    background: var(--card-hover);
  }

  .thumbnail-container:hover img { transform: scale(1.04); }

  .thumbnail-container:hover .play-btn {
    background: rgba(255,0,0,1);
    transform: translate(-50%, -50%) scale(1.1);
  }

  .video-grid {
    max-width: 1440px;
    margin: 0 auto;
    padding: 32px;
    gap: 28px;
  }

  .video-info { padding: 16px 18px; }
  .video-info h3 { font-size: 0.95rem; }
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  html { scroll-behavior: auto; }
  .video-card { opacity: 1; transform: none; }
  .video-card.visible { transition: none; }
}

:focus-visible {
  outline: 2px solid var(--accent);

const categories = [
  { id: "all", label: "All" },
  { id: "league", label: "League" },
  { id: "gaming", label: "Gaming" },
  { id: "korean", label: "한국어" },
  { id: "comedy", label: "Comedy" },
  { id: "documentary", label: "Docs" },
  { id: "tips", label: "Tips" },
];

let activeFilter = "all";
let searchQuery = "";
let shuffled = false;
let shuffleOrder = [];
let activePlayerCard = null;

const grid = document.getElementById("videoGrid");
const searchInput = document.getElementById("search");
const searchClear = document.getElementById("searchClear");
const countEl = document.getElementById("videoCount");
const filterChipsEl = document.getElementById("filterChips");
const noResults = document.getElementById("noResults");
const backToTop = document.getElementById("backToTop");
const shuffleBtn = document.getElementById("shuffleBtn");

function getCounts() {
  const counts = { all: videos.length };
  categories.forEach(c => { if (c.id !== "all") counts[c.id] = 0; });
  videos.forEach(v => {
    (v.tags || []).forEach(t => { if (counts[t] !== undefined) counts[t]++; });
  });
  return counts;
}

function renderChips() {
  const counts = getCounts();
  filterChipsEl.innerHTML = "";
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "chip" + (activeFilter === cat.id ? " active" : "");
    btn.innerHTML = cat.label + ' <span class="count">' + counts[cat.id] + "</span>";
    btn.onclick = () => {
      activeFilter = cat.id;
      shuffled = false;
      renderChips();
      render();
    };
    filterChipsEl.appendChild(btn);
  });
}

function getFiltered() {
  let list = videos;
  if (activeFilter !== "all") {
    list = list.filter(v => v.tags && v.tags.includes(activeFilter));
  }
  if (searchQuery) {
    list = list.filter(v => v.title.toLowerCase().includes(searchQuery));
  }
  if (shuffled && !searchQuery) {
    const idSet = new Set(list.map(v => v.id));
    list = shuffleOrder.filter(v => idSet.has(v.id));
  }
  return list;
}

function parseTitle(title) {
  const sep = title.indexOf(" — ");
  if (sep !== -1) {
    return { creator: title.substring(0, sep), title: title.substring(sep + 3) };
  }
  return { creator: null, title: title };
}

function getPrimaryTag(tags) {
  if (!tags || !tags.length) return null;
  const priority = ["league", "gaming", "korean", "comedy", "documentary", "tips"];
  for (const p of priority) {
    if (tags.includes(p)) return p;
  }
  return tags[0];
}

const tagLabels = { league: "League", gaming: "Gaming", korean: "한국어", comedy: "Comedy", documentary: "Docs", tips: "Tips" };

function createCard(video) {
  const card = document.createElement("div");
  card.className = "video-card";
  card.dataset.id = video.id;

  const parsed = parseTitle(video.title);
  const tag = getPrimaryTag(video.tags);

  card.innerHTML =
    '<div class="thumbnail-container">' +
      '<img data-src="https://i.ytimg.com/vi/' + video.id + '/mqdefault.jpg" alt="" loading="lazy">' +
      '<div class="play-btn"></div>' +
    '</div>' +
    '<div class="video-info">' +
      (parsed.creator ? '<span class="creator">' + escapeHtml(parsed.creator) + '</span>' : '') +
      '<h3>' + escapeHtml(parsed.title) + '</h3>' +
      (tag ? '<span class="tag-badge">' + tagLabels[tag] + '</span>' : '') +
    '</div>' +
    '<div class="player-container hidden">' +
      '<button class="close-player" aria-label="Close player">\xd7</button>' +
      '<iframe data-src="https://www.youtube-nocookie.com/embed/' + video.id + '?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>' +
    '</div>';

  const thumb = card.querySelector(".thumbnail-container");
  const player = card.querySelector(".player-container");

  thumb.onclick = () => {
    if (activePlayerCard && activePlayerCard !== card) stopPlayer(activePlayerCard);
    const iframe = player.querySelector("iframe");
    iframe.src = iframe.dataset.src;
    thumb.classList.add("hidden");
    player.classList.remove("hidden");
    card.classList.add("playing");
    activePlayerCard = card;
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  };

  player.querySelector(".close-player").onclick = (e) => {
    e.stopPropagation();
    stopPlayer(card);
  };

  return card;
}

function stopPlayer(card) {
  const thumb = card.querySelector(".thumbnail-container");
  const player = card.querySelector(".player-container");
  const iframe = player.querySelector("iframe");
  iframe.src = "";
  player.classList.add("hidden");
  thumb.classList.remove("hidden");
  card.classList.remove("playing");
  if (activePlayerCard === card) activePlayerCard = null;
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

const cardObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const card = entry.target;
      card.classList.add("visible");
      const img = card.querySelector("img[data-src]");
      if (img) {
        img.src = img.dataset.src;
        img.removeAttribute("data-src");
        img.onload = () => img.classList.add("loaded");
        img.onerror = () => {
          img.src = "https://i.ytimg.com/vi/" + card.dataset.id + "/hqdefault.jpg";
          img.classList.add("loaded");
        };
      }
      cardObserver.unobserve(card);
    }
  });
}, { rootMargin: "200px", threshold: 0 });

function render() {
  if (activePlayerCard) stopPlayer(activePlayerCard);
  const filtered = getFiltered();
  grid.innerHTML = "";
  noResults.classList.toggle("hidden", filtered.length > 0);
  grid.classList.toggle("hidden", filtered.length === 0);

  filtered.forEach((v, i) => {
    const card = createCard(v);
    card.style.transitionDelay = Math.min(i * 40, 400) + "ms";
    grid.appendChild(card);
    cardObserver.observe(card);
  });

  countEl.textContent = filtered.length + " video" + (filtered.length !== 1 ? "s" : "");
}

searchInput.oninput = () => {
  searchQuery = searchInput.value.toLowerCase().trim();
  searchClear.classList.toggle("visible", searchInput.value.length > 0);
  render();
};

searchClear.onclick = () => {
  searchInput.value = "";
  searchQuery = "";
  searchClear.classList.remove("visible");
  searchInput.focus();
  render();
};

shuffleBtn.onclick = () => {
  shuffleOrder = [...videos];
  for (let i = shuffleOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffleOrder[i], shuffleOrder[j]] = [shuffleOrder[j], shuffleOrder[i]];
  }
  shuffled = true;
  render();
  shuffleBtn.style.transform = "rotate(180deg)";
  setTimeout(() => shuffleBtn.style.transform = "", 300);
};

let scrollTick = false;
window.addEventListener("scroll", () => {
  if (!scrollTick) {
    requestAnimationFrame(() => {
      backToTop.classList.toggle("visible", window.scrollY > 600);
      scrollTick = false;
    });
    scrollTick = true;
  }
}, { passive: true });

backToTop.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
  if (e.key === "Escape") {
    if (activePlayerCard) stopPlayer(activePlayerCard);
    if (document.activeElement === searchInput) searchInput.blur();
  }
});

renderChips();
render();
</script>

</body>
</html>
